services:
  fruit-fs:
    image: ghcr.io/zelder-bit/fruit-fs:latest
    build: .
    container_name: fruit-fs
    restart: unless-stopped
    # Host networking keeps the real client address, which the Tailscale
    # identity check depends on. Docker's port publishing can hide it.
    network_mode: host
    env_file: .env
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ${FRUITFS_DATA_DIR:-./data}:/data
      - ${FRUITFS_STATE_DIR:-./state}:/state
